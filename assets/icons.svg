    <circle cx="12" cy="12" r="3" fill="currentColor"/>
    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 4v3M12 17v3M4 12h3M17 12h3M6.34 6.34l2.12 2.12M15.54 15.54l2.12 2.12M6.34 17.66l2.12-2.12M15.54 8.46l2.12-2.12"/>
    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12h3M21 9l2 3-2 3"/>
  </symbol>

  <!-- Buzzer / Alarm Symbol -->
  <symbol id="icon-buzzer" viewBox="0 0 24 24">
    <path fill="currentColor" d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </symbol>

  <!-- Plant Leaf Symbol -->
  <symbol id="icon-leaf" viewBox="0 0 24 24">
