<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Water Drop Symbol -->
  <symbol id="icon-water-drop" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
    <path fill="rgba(255,255,255,0.3)" d="M9.5 9.5c0 1.5-.7 2.5-2 3 .3-1.8 1-3.2 2-3.8z"/>
  </symbol>

  <!-- Pump / Motor Symbol -->
  <symbol id="icon-pump" viewBox="0 0 24 24">
