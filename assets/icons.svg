  </symbol>

  <!-- CPU / Chip Symbol -->
  <symbol id="icon-chip" viewBox="0 0 24 24">
    <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="8.5" y="8.5" width="7" height="7" fill="currentColor" opacity="0.3"/>
    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
